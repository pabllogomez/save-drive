name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Package plugin
        run: |
          mkdir -p out
          name="save-drive"
          version=$(node -p "require('./package.json').version")
          out="out/${name}-${version}.zip"
          zip -r "$out" main.py py_modules src dist plugin.json package.json README.md GOOGLE-SETUP.md credentials.example.json defaults LICENSE assets
          echo "Created $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-drive
          path: out/*.zip
